<!doctype html><html lang="ru"><head><title>Мирзиёев провел переговоры с Путиным в Москве</title><meta name="author" content="Редакция"></head>
<body><article><p>МОСКВА, 28 сентября — ТАСС. Президент России Владимир Путин провел переговоры с президентом Узбекистана Шавкатом Мирзиёевым.</p><p>Стороны обсудили поставки газа, строительство АЭС и трудовую миграцию, говорится в сообщении пресс-службы Кремля.</p></article></body></html>
